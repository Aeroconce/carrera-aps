# Carrera APS — demo en VPS2 (doc 17): nginx existente como proxy inverso al contenedor `web`.
# Instalar en /etc/nginx/sites-available/demo-carrera.aeroconce.cl y enlazar en sites-enabled.
# Certificado: sudo certbot --nginx -d demo-carrera.aeroconce.cl (certbot añade el bloque 443 y la redirección).
# Tras certbot, añadir al bloque 443 (no lo hace certbot):
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 80;
    listen [::]:80;
    server_name demo-carrera.aeroconce.cl;

    # Subida de planillas y documentos (hasta 10 MB) y descargas grandes (exportación integral)
    client_max_body_size 12m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
